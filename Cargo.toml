[package]
name = "desk"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde_json = "1.0.151"

[build-dependencies]
winresource = "0.1"
